services:
  kafka:
    image: apache/kafka:latest
    container_name: saga-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://saga-kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
      - "9094:9094"
    networks:
      - saga-infra

  redis:
    image: redis:7-alpine
    container_name: saga-redis
    command: redis-server --appendonly yes --save 900 1
    ports:
      - "6379:6379"
    networks:
      - saga-infra

  order-db:
    image: postgres:15-alpine
    container_name: saga-order-db
    environment:
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: order_pass
      POSTGRES_DB: order_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_user -d order_db"]
      interval: 3s
      timeout: 3s
      retries: 10
    ports:
      - "5431:5432"
    networks:
      - saga-infra

  payment-db:
    image: postgres:15-alpine
    container_name: saga-payment-db
    environment:
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: payment_pass
      POSTGRES_DB: payment_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_user -d payment_db"]
      interval: 3s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    networks:
      - saga-infra

  inventory-db:
    image: postgres:15-alpine
    container_name: saga-inventory-db
    environment:
      POSTGRES_USER: inventory_user
      POSTGRES_PASSWORD: inventory_pass
      POSTGRES_DB: inventory_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory_user -d inventory_db"]
      interval: 3s
      timeout: 3s
      retries: 10
    ports:
      - "5433:5432"
    networks:
      - saga-infra

  shipping-db:
    image: postgres:15-alpine
    container_name: saga-shipping-db
    environment:
      POSTGRES_USER: shipping_user
      POSTGRES_PASSWORD: shipping_pass
      POSTGRES_DB: shipping_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipping_user -d shipping_db"]
      interval: 3s
      timeout: 3s
      retries: 10
    ports:
      - "5434:5432"
    networks:
      - saga-infra

  prometheus:
    image: prom/prometheus:latest
    container_name: saga-prometheus
    volumes:
      - ../deployments/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - saga-infra

  grafana:
    image: grafana/grafana:latest
    container_name: saga-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - saga-infra

networks:
  saga-infra:
    driver: bridge
